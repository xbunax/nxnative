# The fork's own checks (the fork-owned workflow; upstream's tests.yml still runs on the unpatched tree).
# - webui-tests: the WebUI/sync tests on Linux, and a drift alarm: do the hook patches still apply to the current upstream?
# - ios-launchers: the staged tree, which is what the WebUI builds from (hook patches applied, and for 'objc' the ObjC launcher
#   in place of upstream's Swift one), compiled for the iPhone SDK and built into an unsigned app with synthetic inputs.
# GitHub's macOS runners are virtual Macs without Metal 4: nothing here runs the game or the launcher, it only builds them.
name: fork-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The same toolchain and test profile as upstream's tests.yml (dm/tools/tests/test_ci_toolchain.py keeps those in step)
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  GAME: 010015100B514000
  PYTHONUTF8: '1'

defaults:
  run:
    shell: bash

jobs:
  webui-tests:
    name: WebUI tests and hook patches against upstream
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NX_REQUIRE_TEST_DEPS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: webui/requirements-sync-ci.txt
      - run: python -m pip install -r webui/requirements-sync-ci.txt
      - name: WebUI tests
        run: python -m unittest discover -s webui/tests -t . -v
      - name: Do the hook patches apply to the current upstream?
        run: |
          python webui/tools/init_fork.py --fetch
          python webui/tools/sync_check.py --base HEAD --ref upstream/main

  ios-launchers:
    name: Staged iOS tree (${{ matrix.launcher }} launcher)
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        launcher: [objc, swiftui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage (hook patches applied; the ObjC launcher replaces the Swift one for objc)
        id: stage
        run: |
          tree="$(python3 webui/tools/stage.py ensure --launcher '${{ matrix.launcher }}' --stage-root "$RUNNER_TEMP/stage" --rebuild --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["tree"])')"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          python3 webui/tools/stage.py verify "$tree"
          ls "$tree/dm/ios/Sources"
      - name: iOS host sources compiled for the iPhone SDK (includes DmLauncher.m in an objc stage)
        working-directory: ${{ steps.stage.outputs.tree }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          python3 dm/ios/tools/compile_check.py 2>&1 | tee "$RUNNER_TEMP/logs/ios-compile-${{ matrix.launcher }}.log"
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Unsigned iOS app from the staged tree (synthetic modules, launcher.json, link)
        working-directory: ${{ steps.stage.outputs.tree }}
        run: python3 dm/ios/tools/build_smoke.py --output "$RUNNER_TEMP/ios-smoke" 2>&1 | tee "$RUNNER_TEMP/logs/ios-build-${{ matrix.launcher }}.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-fork-ci-${{ matrix.launcher }}
          path: ${{ runner.temp }}/logs
          retention-days: 7
